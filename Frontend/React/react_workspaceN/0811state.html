<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body>

<!-- 모든출력은 root 아이디 안에 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        let rootNode = document.getElementById("root");
        //ReactDOM라이브러리와 위에있는 div태그랑 연동하고 모든코드는 React.StrictMode에

        // 2. 컴포넌트를 호출할 때는 <MyComponent1 /> 처럼 작성해야 합니다.
        ReactDOM.createRoot(rootNode).render(
            <React.StrictMode>
                <h1>Hello React</h1>
                <MyComponent1/>
            </React.StrictMode>
        )

        function MyComponent1(){
            const [name, setName] = useState("");
            //state는 우리가 만드는게 아님, useState(초기화값),정수,문자열,배열,객체
            //state공간에 문자열 저장할 공간 만들고, 그 주소와 공간값 바꿀수있는 함수를 반환
            //const [name, setName]는 내가 만드는게 아니라 내가 받아오는 것임. (let으로 받아오지X)
            //반드시 return있어야함(화면에 보여지는 부분)
            //let
            const setValue=()=>{
                setName("홍길동");
            }
            return(
                <div>
                    <h1>이름 : {name} </h1>
                    <h1>나이 : {age} </h1>
                    <button type="button" onClick={setValue}>이름 변경</button>
                </div>
            )
        }
    </script>
</body>
</html>
