<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body>

<!-- 모든출력은 root 아이디 안에 -->
    <div id="root"></div>
<!-- props를 통해 자식컴포넌트에 값보냄. (값받기는 불가능)
    부모 => 자식, 키=값 형태로 전송. 받는쪽에서는 props. 키
    부모가 함수도 자식한테 보낼수있음. 자식쪽에서는 부모한테 무슨일을 알리고싶으면 부모함수 호출.
    데이터는 위에서 아래로 흐르고, 이벤트는 아래에서 위로 올라간다
    <부모 컴포넌트>
        <자식 컴포넌트1 msg="안녕하세요"/>
        <자식 컴포넌트2 msg="Hello"/>
    <부모 컴포넌트/>
-->
    <script type="text/babel">
        const { useState } = React; 
        let rootNode = document.getElementById("root");
        //ReactDOM라이브러리와 위에있는 div태그랑 연동하고 모든코드는 React.StrictMode에
        ReactDOM.createRoot(rootNode).render(
            <React.StrictMode>
                <h1>Hello React</h1>  
                <App title="제목1" contents="내용" />          
            </React.StrictMode>
        )

        function App(props){
            //props로 부모가 보낸 {키.값}형태로 받아올수있다
            return(
                <div>
                    <h1>{props.title}</h1>
                    <h1>{props.contents}</h1>
                </div>
            )}

        //const {title, contents} = props 임
        function App2({title, contents}){
            return(
                <div>
                    <h1>{title}</h1>
                    <h1>{contents}</h1>
                </div>
            )}
    </script>

</body>
</html>
