<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body>

<!-- 모든출력은 root 아이디 안에 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React; //이코드쓰면 아래 React.빼도됨
        // useState를 React에서 가져와서 사용할 수 있게 합니다.
        
        let rootNode = document.getElementById("root");
        //ReactDOM라이브러리와 위에있는 div태그랑 연동하고 모든코드는 React.StrictMode에
        ReactDOM.createRoot(rootNode).render(
            <React.StrictMode>
                <Calculator />
            </React.StrictMode>
        );

        //input태그랑 state 연동
        function Calculator(){
            const [x, setx] = React.useState(0);
            const [y, sety] = React.useState(0);
            const [result, setResult] = React.useState(0);

            const add =()=>{setResult(parseInt(x) + parseInt(y));};
            const sub =()=>{setResult(parseInt(x) - parseInt(y));};
            const mul =()=>{setResult(parseInt(x) * parseInt(y));};
            const div =()=>{setResult(parseInt(x) / parseInt(y));};

            function xChange(e){setx(e.target.value);}
            //함수-이벤트핸들러:이벤트에 반응해서 호출될 함수들
            //이벤트가 발생하면 함수의 매개변수 이벤트 객체 전달해준다
            console.log(e); //e.target-이벤트를 발생시킨 객체정보가 들어옴
            //console.log(e)코드를 지워도되는 이유는, 개발자용 디버깅코드이기 때문에 정상작동확인후 삭제해서 불필요한 로그삭제.

            function yChange(e){
                console.log(e.target.value);
                sety(e.target.value);
            }

            return (
                <div>
                    <h1>계산기</h1>
                    x : <input type="text" onChange={xChange} /><br/>
                    y : <input type="text" onChange={yChange} /><br/>

                    <button type="button" onClick={add}>+</button>
                    <button type="button" onClick={sub}>-</button>
                    <button type="button" onClick={mul}>*</button>
                    <button type="button" onClick={div}>/</button>
                    <h1>결과: {result}</h1>
                    <p>x값: {x}, y값: {y}</p>
                </div>
            )
        }
    </script>
</body>
</html>
