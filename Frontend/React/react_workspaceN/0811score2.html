<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body>

<!-- 모든출력은 root 아이디 안에 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React; //이코드쓰면 아래 React.빼도됨
        // useState를 React에서 가져와서 사용할 수 있게 합니다.
        let rootNode = document.getElementById("root");
        // Score 컴포넌트를 렌더링합니다.
        ReactDOM.createRoot(rootNode).render(
            <React.StrictMode>
                <Score />
            </React.StrictMode>
        );

        //input태그랑 state 연동
        //이름,국어,영어,수학 입력받아 총점,평균 출력하는 Score컴포넌트 만들기
        //컴포넌트3개로 쪼개서 Main(목록, 목록에 추가되는함수1), ScoreInput(입력), ScoreOutput(출력)
        // 형제간에는 못주고받음. 너무많이 쪼개서 오고가면 시작도 끝도 모름
        //그래서 완전히 분리시켜서 별도관리 : redux(일명 스토어)
        //json으로 받아옴. append:함수주고, scoreList:데이터받아오고
        function MainComponent(){
            const [scoreList, setScoreList] = React.useState([{name:"A", kor:90, eng:80, mat:70, result:""}])
            
            function append(obj){setScoreList([...scoreList, obj])}
            return(
                <div>
                    <scoreInput append={append} /> 
                    <scoreOuput scoreList={scoreList} />
                </div>
            )
        }
        function ScoreInput({append}){
            const [name, setName] = React.useState("");
            const [kor, setKor] = React.useState(0);
            const [eng, setEng] = React.useState(0);
            const [mat, setMat] = React.useState(0);
            const [result, setResult] = React.useState("");

            //총점 평균
            const process = ()=> { 
                let total = parseInt(kor) + parseInt(eng) + parseInt(mat);
                let avg = total / 3;
                setResult(`${name}의 총점은 ${total}점이고, 평균은 ${avg.toFixed(0)}점입니다.`);
                append({"name":name, "kor":kor, "eng":eng, "mat":mat, "result":result});
            }
            function nameChange(e){setName(e.target.value); }
            function korChange(e){setKor(e.target.value); }
            function engChange(e){setEng(e.target.value); }
            function matChange(e){setMat(e.target.value); }

            function clear(){
                setName("");
                setKor(0);
                setEng(0);
                setMat(0);
                setResult("");
            }

            return(
                <div>
                    이름 : <input type="text" onChange={nameChange} /> <br/>
                    국어 : <input type="text" onChange={korChange} /> <br/>
                    영어 : <input type="text" onChange={engChange} /> <br/>
                    수학 : <input type="text" onChange={matChange} /> <br/>
                    <h1>{result}</h1> 
                    <button type="button" onClick={process}>확인</button>
                    <button type="button" onClick={clear}>리셋</button>
                </div>
            )
        }

        function ScoreOutput({scoreList}){
            return(
                <table>
                    {
                        scoreList.map( (obj, i)=>{
                            return(
                                <tr key={i}>
                                    <td>{obj.name}</td>
                                    <td>{obj.kor}</td>
                                    <td>{obj.eng}</td>
                                    <td>{obj.mat}</td>
                                    <td>{obj.result}</td>
                                </tr>
                            )
                        })
                    }
                </table>
            )
        }
    </script>
</body>
</html>
