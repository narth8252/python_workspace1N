<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>
<body>

<!--  부모-자식 컴포넌트 구조를 이용한 카운터-->
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React; 
        let rootNode = document.getElementById("root");
        //ReactDOM라이브러리와 위에있는 div태그랑 연동하고 모든코드는 React.StrictMode에
        ReactDOM.createRoot(rootNode).render(
            <React.StrictMode>
                <h1>Hello React</h1> 
                {/* App 컴포넌트에 props를 전달합니다. */}
                <App /> 
            </React.StrictMode>
        )

        // 부모 컴포넌트 (App)
        function App({title, contents}){
            const [result, setResult] = React.useState(0);
            const calc = (oper, x, y) => { 
                switch(oper){
                case '1' : setResult(x+y); break;
                case '2' : setResult(x-y); break;
                case '3' : setResult(x*y); break;
                case '4' : setResult((x/y).toFixed(0)); break; //소수점0번까지
            } 
        }

            return(
                <div>
                    <h1>결과: {result} (App)</h1>
                    <AddSub func={calc} />
                </div>
            )}


        // 자식 컴포넌트 (Counter)
        function AddSub(props) {
            const [x, setX]=React.useState(5);
            const [y, setY]=React.useState(15);

            const xChange = (e)=>{ setX(e.target.value);}
            const yChange = (e)=>{ setY(e.target.value);}

            //부모함수주소만 주면 안된다. 매개변수를 부모함수로 전달해야 한다
            return(
            <div>
                <h1>부모함수에 매개변수 전달하기</h1>
                x : <input type="text" name="" id="" value={x} onChange={xChange}/><br/>
                y : <input type="text" name="" id="" value={y} onChange={yChange}/><br/>

                <button type="button" onClick={()=>(props.func('1', x, y)) }>+</button>
                <button type="button" onClick={()=>(props.func('2', x, y)) }>-</button>
                <button type="button" onClick={()=>(props.func('3', x, y)) }>x</button>
                <button type="button" onClick={()=>(props.func('4', x, y)) }>/</button>
            </div>
        )
    }

    </script>
</body>
</html>
